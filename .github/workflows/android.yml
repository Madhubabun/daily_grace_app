name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Release signing: add the repository secrets DG_KEYSTORE_BASE64, DG_KEYSTORE_PASSWORD,
      # DG_KEY_ALIAS and DG_KEY_PASSWORD. Without them the release APK is signed with the
      # runner's throwaway debug key and cannot update an installed release build.
      - name: Restore release keystore
        env:
          DG_KEYSTORE_BASE64: ${{ secrets.DG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DG_KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$DG_KEYSTORE_BASE64" | base64 -d > signing/daily-grace-release.jks
            echo "DG_KEYSTORE_FILE=signing/daily-grace-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; release APK uses a temporary debug key."
          fi

      - name: Build release APK
        env:
          DG_KEYSTORE_PASSWORD: ${{ secrets.DG_KEYSTORE_PASSWORD }}
          DG_KEY_ALIAS: ${{ secrets.DG_KEY_ALIAS }}
          DG_KEY_PASSWORD: ${{ secrets.DG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: daily-grace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daily-grace-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Every build of main is published on the repository's Releases page, so the newest APKs
      # can be downloaded straight to a phone. Pushing a v* tag publishes a named version too.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Daily Grace {0}', github.ref_name) || format('Daily Grace build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Install **DailyGrace-release.apk** on your phone. DailyGrace-debug.apk is for testing and installs alongside it.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
